version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fire-station-app
    restart: unless-stopped
    working_dir: /var/www
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:-}
      APP_NAME: FireStationManager
      APP_URL: http://localhost
      DB_CONNECTION: sqlite
      LOG_CHANNEL: single
    volumes:
      - ./:/var/www
      - ./storage/logs:/var/www/storage/logs
    ports:
      - "8000:8000"
    command: php artisan serve --host=0.0.0.0 --port=8000
    depends_on:
      - db
    networks:
      - pumper-network

  # Optional: MySQL Database Service
  db:
    image: mysql:8.0
    container_name: fire-station-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-pompiers}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_USER: ${DB_USERNAME:-pompiers}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - pumper-network
    # Uncomment to use MySQL instead of SQLite
    # - Change DB_CONNECTION to mysql in .env
    # - Uncomment depends_on in app service

  # Optional: PhpMyAdmin for Database Management
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: fire-station-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: ${DB_USERNAME:-pompiers}
      PMA_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "8081:80"
    depends_on:
      - db
    networks:
      - pumper-network
    # Remove this service if not needed

  # Optional: Nginx Reverse Proxy (for production)
  nginx:
    image: nginx:latest
    container_name: fire-station-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - pumper-network
    # Uncomment for production with Nginx instead of built-in PHP server

volumes:
  db_data:

networks:
  pumper-network:
    driver: bridge
